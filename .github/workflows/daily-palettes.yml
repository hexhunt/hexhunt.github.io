name: Daily Color Palettes & GitHub Pages Deploy

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC every day
  workflow_dispatch:      # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Palette Generator
        run: node scripts/generate-palettes.js

      - name: Commit & Push updated palettes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/palettes.json)" ]; then
            git add src/data/palettes.json
            git commit -m "chore(data): auto-generate daily color schemes [skip ci]"
            git push
          else
            echo "No new palette changes detected to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
